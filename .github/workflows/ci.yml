name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          # No go.mod here (Go solutions are single self-contained files), so
          # there is nothing to cache and the restore step only warns.
          cache: false

      - name: Ensure g++ and rustc are available
        run: |
          g++ --version || (sudo apt-get update && sudo apt-get install -y g++)
          rustc --version || (sudo apt-get update && sudo apt-get install -y rustc)

      - name: Run all solutions
        run: python run.py

      - name: Check the JSON contract the extension relies on
        run: python scripts/check_json_contract.py

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install extension dev dependencies
        working-directory: extension
        run: npm ci

      - name: Type-check
        working-directory: extension
        run: npx tsc -p ./ --noEmit

      # Covers the extension's own logic plus the contract it has with run.py
      # and complexity.py, which is what the test panel depends on. Java is set
      # up above because two_sum is solved in Java as well as Python.
      - name: Test
        working-directory: extension
        run: npm test

      - name: Package the extension
        working-directory: extension
        run: npm run package

      - name: Upload the vsix
        uses: actions/upload-artifact@v7
        with:
          name: solvebench-vsix
          path: extension/*.vsix
          if-no-files-found: error
